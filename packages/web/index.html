    <!-- Tab icon: the Oraiza logo (src/assets/Oraiza_Logo.svg) as PNGs, its hexagon
         alone without the dark square tile, filling the icon top
         to bottom, so it reads in a dark tab bar. icon-192/512 (installed app, manifest) keep the tile; so does the
         apple-touch icon, its corners filled with the tile's dark green, since iOS
         paints them black. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="referrer" content="no-referrer" />
