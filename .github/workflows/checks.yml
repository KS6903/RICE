name: Checks

# Every check CI runs, as one reusable workflow. ci.yml calls it on each push to
# main and each pull request; deploy.yml calls it as the gate in front of a
# deploy, so a deploy runs exactly what CI runs. Callers own the triggers and
# the concurrency. scripts/ci_local.mjs mirrors these steps for the pre-push hook.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest derives "<db> Test" and creates it via the maintenance DB.
      # Use 127.0.0.1 (not localhost): on GitHub runners localhost can resolve to
      # IPv6 ::1 while the postgres service only publishes on IPv4, which would
      # make conftest's connection refused and pytest exit 4 at collection.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice
      SECRET_KEY: ci-test-secret-key
      REDIS_URL: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify Postgres is reachable
        run: |
          python -c "import psycopg; psycopg.connect('host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres').close(); print('postgres reachable')"
      - name: Lockfiles match their inputs
        # Installs read only the hash-pinned .txt locks, so a pin bumped in a
        # .in file without a relock would otherwise ship untested.
        run: python scripts/check_lockfiles.py
      - name: Lint (ruff, whole backend; migrations excluded by config)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Type-check (mypy, whole backend)
        run: mypy
      - name: Single Alembic head
        # Two heads means two migrations claim the same parent; upgrade would
        # refuse to pick one. Cheap to catch here, painful at deploy time.
        run: |
          heads="$(python -m alembic heads)"
          echo "$heads"
          test "$(printf '%s\n' "$heads" | grep -c .)" -eq 1
      - name: Tests (pytest)
        run: pytest

  migrations:
    name: Migrations match the models
    # Two paths on a disposable database: main's schema plus this branch's new
    # migrations (what production goes through), and every migration from
    # empty (a new environment). Each ends with `alembic check`, which fails
    # when the models describe something the migrations don't build.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice_drift
      SECRET_KEY: ci-test-secret-key
      REDIS_URL: ""
      # The schema to upgrade from: a PR's base, or the commit before a push.
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Upgrade path and fresh path
        run: |
          base=""
          # A new branch's "before" is all zeros; a deploy dispatch has none.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]              && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            base="--base-ref $BASE_SHA"
          fi
          python scripts/check_migrations.py --database-url "$DATABASE_URL" $base

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the web app (type-check + production bundle)
        run: npm run build:web
      - name: Unit tests (Vitest)
        run: npm run test:web
      - name: Lint (ESLint, zero warnings)
        run: npm run lint --workspace=packages/web
      - name: Type-check the Worker
        run: npm run cf:typecheck
      - name: Bundle the Worker (dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir "$RUNNER_TEMP/worker"
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Desktop unit tests (Vitest)
        run: npm run test:desktop
      - name: Type-check the desktop app
        run: npx tsc -p packages/desktop/tsconfig.json --noEmit
      - name: Format check (Prettier)
        run: npm run format:check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install locked security tools
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: pip-audit (backend dependency CVEs)
        run: pip-audit -r backend/requirements.txt --disable-pip --require-hashes
      - name: bandit (Python SAST, medium+ severity)
        run: bandit -r backend/app -ll -q
      - name: gitleaks (secret scanning, full history)
        # The pinned CLI rather than gitleaks-action: the action calls the GitHub
        # API and fails on Dependabot PRs ("Resource not accessible by
        # integration"). Rules and the one historical exception: .gitleaks.toml.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: npm audit
        run: npm audit --omit=dev

  semgrep:
    name: Semgrep (SAST)
    # Replaces CodeQL, whose code scanning isn't available on this private repo's
    # plan. Findings fail the job; reviewed exceptions carry a `nosemgrep` comment
    # with the reason, and .semgrepignore scopes what is scanned.
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Semgrep
        run: semgrep scan --config p/python --config p/typescript --config p/react --metrics=off --error

  docker:
    name: API image
    # wrangler builds this image only at deploy time, so without this job a
    # broken Dockerfile or build context would surface mid-deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Build the image (repository-root context, as wrangler.jsonc builds it)
        run: docker build -f backend/Dockerfile -t oryza-api:ci .
      - name: Boot it and hit /api/health
        run: |
          docker run -d --name api -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/unused \
            -e SECRET_KEY=ci-test-secret-key \
            -e REDIS_URL= \
            oryza-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  e2e-api:
    name: API end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # backend/start_disposable_e2e.py refuses any database whose name lacks
      # "e2e", then drops, recreates, migrates and seeds it before serving.
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice_e2e
      E2E_PYTHON: python
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: API end-to-end tests
        # Request-level tests only, so no browser download is needed.
        run: npm run test:e2e:api
