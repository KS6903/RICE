name: Deploy preview (Cloudflare)

# The preview site: app.oraiza.workers.dev, built from wrangler.jsonc
# env.preview (ENV=preview: production checks, except the legal "To follow"
# details and email are allowed to be missing). See PREVIEW_DEPLOY.md for the
# one-time setup.
#
# It deploys itself after every push to main whose CI passed, using that CI run
# as the check instead of running checks.yml again; the button runs the full
# checks first. Either way: main only, then the readiness gate for env.preview.
# It uses repository secrets prefixed PREVIEW_, not a GitHub environment:
# environments aren't available to this private repository's plan, and the
# preview must never pick up production's.
on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Also roll out the container images (uncheck for a Worker-only change)"
        type: boolean
        default: true
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-preview
  cancel-in-progress: false

env:
  # After CI, the commit that CI tested, not whatever main is by now.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  main-only:
    name: Deploys run from main only
    # After CI: only a green run on main of this repository, never a pull request
    # (a fork's branch can be called main too). A push, or the re-test CI's
    # automerge dispatches after merging a Dependabot PR: that merge is made with
    # the workflow token, which starts no push run, and the dispatch then cancels
    # the push run of anything merged just before it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    steps:
      - name: Refuse any other branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only; this run is on ${GITHUB_REF}."
          exit 1
      - name: On main
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying ${DEPLOY_SHA} from main to the preview."

  verify:
    # After CI the checks have just passed for this commit; the button runs them.
    if: github.event_name == 'workflow_dispatch'
    needs: main-only
    uses: ./.github/workflows/checks.yml

  readiness:
    name: Preview readiness
    needs: main-only
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fresh virtualenv (a self-hosted runner reuses its Python)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Would the preview's containers boot with this configuration?
        run: python backend/deploy_readiness.py --env preview

  migrate:
    name: Migrate the preview database
    # Schema first, code second, with the preview's provisioner (DDL) credential.
    needs: [verify, readiness]
    # verify is skipped after CI, which would skip this job too without a condition.
    if: >-
      !cancelled() && needs.readiness.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    env:
      PROCESS_ROLE: provisioner
      PROVISIONER_DATABASE_URL: ${{ secrets.PREVIEW_PROVISIONER_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.PREVIEW_PROVISIONER_DATABASE_URL }}
      RUNTIME_DATABASE_ROLE: ricemill_app
      # Settings requires one; this job signs nothing, so it never sees the real key.
      SECRET_KEY: migrations-only-not-a-signing-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      # After the checkout: the job's steps run in backend/, which doesn't exist
      # until the repository is checked out.
      - name: The preview's provisioner credential is set
        run: |
          if [ -z "$PROVISIONER_DATABASE_URL" ]; then
            echo "::error::Add PREVIEW_PROVISIONER_DATABASE_URL to the repository's Actions secrets."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fresh virtualenv (a self-hosted runner reuses its Python)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Public schema (alembic upgrade head)
        run: python -m alembic upgrade head
      - name: Every tenant schema (fails the deploy if any tenant fails)
        run: python migrate_all_tenants.py

  deploy:
    needs: [verify, readiness, migrate]
    if: >-
      !cancelled() && needs.migrate.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    steps:
      - name: The Cloudflare credentials are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add PREVIEW_CLOUDFLARE_API_TOKEN and PREVIEW_CLOUDFLARE_ACCOUNT_ID to the repository's Actions secrets."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the SPA
        run: npm run build:web
      # Not `inputs.containers && '' || ...`: '' is falsy in an expression, so that
      # form always picked --containers-rollout=none and never built the images.
      # After CI there are no inputs: the images always roll out.
      - name: Deploy
        run: npx wrangler deploy --env preview ${{ github.event_name == 'workflow_dispatch' && !inputs.containers && '--containers-rollout=none' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
