name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks themselves live in checks.yml, which deploy.yml also calls, so
  # the deploy gate and CI cannot drift apart.
  checks:
    uses: ./.github/workflows/checks.yml
