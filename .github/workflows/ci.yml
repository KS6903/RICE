name: CI

# Lightweight CI added in Phase 0 of the OOP-standardization refactor.
# Backend: characterization + unit tests against a real Postgres, plus scoped
# ruff/mypy. Frontend: Vitest + typecheck (eslint/prettier are advisory while we
# migrate legacy code per "lint on touch").

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest derives "<db> Test" and creates it via the maintenance DB.
      # Use 127.0.0.1 (not localhost): on GitHub runners localhost can resolve to
      # IPv6 ::1 while the postgres service only publishes on IPv4, which would
      # make conftest's connection refused and pytest exit 4 at collection.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice
      SECRET_KEY: ci-test-secret-key
      REDIS_URL: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify Postgres is reachable
        run: |
          python -c "import psycopg; psycopg.connect('host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres').close(); print('postgres reachable')"
      - name: Lint (ruff, scoped)
        run: ruff check tests
      - name: Type-check (mypy, scoped)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck --workspace=packages/web
      - name: Unit tests (Vitest)
        run: npm run test:web
      - name: Lint (advisory during migration)
        run: npm run lint --workspace=packages/web
        continue-on-error: true
      - name: Format check (advisory during migration)
        run: npm run format:check
        continue-on-error: true
