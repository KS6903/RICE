name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The automerge job below dispatches this to re-test main after a merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks themselves live in checks.yml, which deploy.yml also calls, so
  # the deploy gate and CI cannot drift apart.
  checks:
    uses: ./.github/workflows/checks.yml

  # Dependabot's minor/patch PRs merge themselves once every check passes.
  # GitHub's native auto-merge needs branch protection, which this repo's plan
  # doesn't offer, so this job merges directly. It lives here and not in
  # checks.yml because deploy.yml calls checks.yml with read-only permissions.
  automerge:
    needs: checks
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write # to dispatch the re-test of main
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge minor and patch updates, then re-test main
        # update-type is the highest semver change in the PR, so a grouped PR
        # that also carries a major never qualifies.
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --match-head-commit merges only the exact commit that passed. main may
          # have moved since these checks ran, and a merge made with this token
          # triggers no CI on main, so dispatch a run of this workflow on main: the
          # one kind of run this token may start. A bad combination then shows up
          # as a red main instead of slipping by; deploys re-run every check anyway.
          gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
          gh workflow run ci.yml --repo "$REPO" --ref main
