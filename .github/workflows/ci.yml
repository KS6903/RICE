name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest derives "<db> Test" and creates it via the maintenance DB.
      # Use 127.0.0.1 (not localhost): on GitHub runners localhost can resolve to
      # IPv6 ::1 while the postgres service only publishes on IPv4, which would
      # make conftest's connection refused and pytest exit 4 at collection.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice
      SECRET_KEY: ci-test-secret-key
      REDIS_URL: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify Postgres is reachable
        run: |
          python -c "import psycopg; psycopg.connect('host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres').close(); print('postgres reachable')"
      - name: Lint (ruff, scoped)
        run: ruff check tests
      - name: Type-check (mypy, scoped)
        run: mypy
      - name: Tests (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck --workspace=packages/web
      - name: Unit tests (Vitest)
        run: npm run test:web
      - name: Lint (advisory during migration)
        run: npm run lint --workspace=packages/web
        continue-on-error: true
      - name: Format check (advisory during migration)
        run: npm run format:check
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked security tools
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock
      - name: pip-audit (backend dependency CVEs)
        run: pip-audit -r backend/requirements.lock --disable-pip --require-hashes
      - name: bandit (Python SAST, medium+ severity)
        run: bandit -r backend/app -ll -q
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: npm audit
        run: npm audit --omit=dev

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d # v3
