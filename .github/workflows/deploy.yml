name: Deploy (Cloudflare)

# Manual only, on purpose: nothing reaches production on a push. Three gates must
# pass before the deploy job may start:
#   1. main-only  - deploys run from main, never from a feature branch;
#   2. verify     - checks.yml, the very same workflow CI runs;
#   3. readiness  - rebuilds each container's production environment from
#                   wrangler.jsonc and worker/container-env.json and runs the
#                   boot-time validator, so a config the API would refuse to
#                   start with (template values, unfilled legal placeholders)
#                   blocks here instead of crash-looping after rollout.
on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Also roll out the container images (uncheck for a Worker-only change)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-only:
    name: Deploys run from main only
    runs-on: ubuntu-latest
    steps:
      - name: Refuse any other branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only; this run is on ${GITHUB_REF}."
          exit 1
      - name: On main
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying ${GITHUB_SHA} from main."

  verify:
    needs: main-only
    uses: ./.github/workflows/checks.yml

  readiness:
    name: Production readiness
    needs: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Would the containers boot with this configuration?
        run: python backend/deploy_readiness.py

  deploy:
    needs: [verify, readiness]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the SPA
        run: npm run build:web
      - name: Deploy
        run: npx wrangler deploy ${{ inputs.containers && '' || '--containers-rollout=none' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
