name: Deploy (Cloudflare)

# Manual only, on purpose: nothing reaches production on a push. The verify job
# re-runs the CI checks and the deploy job refuses to start unless they pass.
on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Also roll out the container images (uncheck for a Worker-only change)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rice
      SECRET_KEY: ci-test-secret-key
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - name: Backend tests
        run: pytest
        working-directory: backend
      - name: Backend type-check
        run: mypy
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend type-check
        run: npm run typecheck --workspace=packages/web
      - name: Worker type-check
        run: npm run cf:typecheck
      - name: Frontend tests
        run: npm run test:web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the SPA
        run: npm run build:web
      - name: Deploy
        run: npx wrangler deploy ${{ inputs.containers && '' || '--containers-rollout=none' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
