name: Deploy (Cloudflare)

# Manual only, on purpose: nothing reaches production on a push. Three gates must
# pass before the deploy job may start:
#   1. main-only  - deploys run from main, never from a feature branch;
#   2. verify     - checks.yml, the very same workflow CI runs;
#   3. readiness  - rebuilds each container's production environment from
#                   wrangler.jsonc and worker/container-env.json and runs the
#                   boot-time validator, so a config the API would refuse to
#                   start with (template values, unfilled legal placeholders)
#                   blocks here instead of crash-looping after rollout.
# Then migrate brings the database (public schema, then every tenant schema)
# to this code, and only then does the new code roll out.
on:
  workflow_dispatch:
    inputs:
      containers:
        description: "Also roll out the container images (uncheck for a Worker-only change)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-only:
    name: Deploys run from main only
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    steps:
      - name: Refuse any other branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only; this run is on ${GITHUB_REF}."
          exit 1
      - name: On main
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying ${GITHUB_SHA} from main."

  verify:
    needs: main-only
    uses: ./.github/workflows/checks.yml

  readiness:
    name: Production readiness
    needs: main-only
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fresh virtualenv (a self-hosted runner reuses its Python)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: Would the containers boot with this configuration?
        run: python backend/deploy_readiness.py

  migrate:
    name: Migrate the database
    # Schema first, code second: the API checks at /api/health/ready that the
    # database is at this code's migrations. Uses the provisioner (DDL)
    # credential, which only this job and the provisioner container hold; the
    # database must accept connections from the CI runner.
    needs: [verify, readiness]
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    environment: production
    env:
      PROCESS_ROLE: provisioner
      PROVISIONER_DATABASE_URL: ${{ secrets.PROVISIONER_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.PROVISIONER_DATABASE_URL }}
      RUNTIME_DATABASE_ROLE: ${{ vars.RUNTIME_DATABASE_ROLE }}
      # Settings requires one; this job signs nothing, so it never sees the real key.
      SECRET_KEY: migrations-only-not-a-signing-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      # After the checkout: the job's steps run in backend/, which doesn't exist
      # until the repository is checked out.
      - name: The provisioner credential is set
        run: |
          if [ -z "$PROVISIONER_DATABASE_URL" ]; then
            echo "::error::Add PROVISIONER_DATABASE_URL to the production environment's secrets."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fresh virtualenv (a self-hosted runner reuses its Python)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Public schema (alembic upgrade head)
        run: python -m alembic upgrade head
      - name: Every tenant schema (fails the deploy if any tenant fails)
        run: python migrate_all_tenants.py

  deploy:
    needs: [verify, readiness, migrate]
    runs-on: ${{ vars.CI_RUNNER || 'rice-ci' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the SPA
        run: npm run build:web
      # Not `inputs.containers && '' || ...`: '' is falsy in an expression, so that
      # form always picked --containers-rollout=none and never built the images.
      - name: Deploy
        run: npx wrangler deploy ${{ !inputs.containers && '--containers-rollout=none' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
