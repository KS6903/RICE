# Local infrastructure for the Rice Mill System.
# Start just Redis with:  docker compose up -d redis
#
# Redis is used as a cache-aside layer (see backend/app/core/cache.py). The app
# runs fine without it — when Redis is down, reads fall back to PostgreSQL.
services:
  redis:
    image: redis:7-alpine
    container_name: ricemill-redis
    ports:
      - "6379:6379"
    # Cache-tuned: cap memory and evict least-recently-used keys when full, so
    # Redis behaves like a bounded cache rather than growing unbounded.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
