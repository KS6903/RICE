# Local infrastructure for the Rice Mill System.
# Start just Redis with:  docker compose up -d redis
#
# Redis is used as a cache-aside layer (see backend/app/core/cache.py). The app
# runs fine without it — when Redis is down, reads fall back to PostgreSQL.
services:
  redis:
    image: redis:7.4-alpine
    container_name: ricemill-redis
    ports:
      # Local development only. Never publish Redis on a public interface.
      - "127.0.0.1:6379:6379"
    # Security state must not be evicted or disappear on a routine restart.
    # Production should use private networking, ACL authentication, and TLS.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
