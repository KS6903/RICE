# Tooling config for the RICE backend.
# Added as part of the OOP-standardization refactor (Phase 0 — safety scaffolding).
# This file configures dev tools only; it does NOT change runtime behavior.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    # passlib probes bcrypt's version in a way that warns on newer bcrypt; harmless.
    "ignore::DeprecationWarning",
    # starlette.testclient warns when driven by httpx (vs httpx2); framework-level
    # and not a DeprecationWarning subclass, so it needs its own ignore.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
# Match the existing code style. Start lenient; we tighten over time.
line-length = 120
target-version = "py311"
# Legacy modules are refactored phase-by-phase. Only lint what we've touched so
# far so `ruff check` stays green during the rollout. Add paths as domains land.
extend-exclude = ["migrations"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle essentials, I = import sorting.
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as a hard error
]

[tool.ruff.lint.per-file-ignores]
# conftest must set test env vars BEFORE importing app.*, so its imports are
# intentionally not top-of-file and not auto-sortable.
"tests/conftest.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# The whole backend: the app, its scripts, and every top-level script. Tests
# and migrations are not type-checked.
files = ["app", "scripts", "*.py"]
follow_imports = "normal"
check_untyped_defs = true
warn_redundant_casts = true
# pydantic's plugin types models and settings the way pydantic builds them:
# a Settings() reads its fields from the environment, so none is a required
# argument, and a model built from a dict is validated at runtime, not here.
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
